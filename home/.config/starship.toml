# Starship prompt — https://starship.rs/config/
# Modules use sensible defaults out of the box; tweak below as needed.

# Put the directory first; "$all" appends every other module in default order —
# including the line break before $character that gives the two-line prompt.
# The blank line before the prompt is a LITERAL newline (the empty first line of
# this multi-line string), NOT $line_break — using $line_break explicitly would
# pull it out of "$all" and collapse the prompt onto one line.
format = """

$directory$all"""

# Off globally so the blank line (above, live prompt only) isn't inherited by the
# collapsed transient prompts.
add_newline = false

# Wait up to 1s for slow commands (e.g. git status in huge repos) before skipping.
command_timeout = 1000

# Directory-scan budget per prompt. Default is 30ms; raised because scanning
# Windows-mounted paths (/mnt/c) over WSL's 9p filesystem is slow. The real fix
# is to work in the Linux filesystem (~/) rather than /mnt/c.
scan_timeout = 50

# Hide the Python module. A user-global venv is always active, so VIRTUAL_ENV is
# always set and this module would otherwise render in every directory. Re-enable
# (or drop the always-on venv in favour of pipx) if you want version-in-projects.
[python]
disabled = true

# Hide the gcloud module — it shows the active GCP account (your email) on the
# corp server. Disable rather than reformat since we don't want it at all.
[gcloud]
disabled = true

# Drop the " in " connector from username/hostname. It's there by default because
# they normally precede the directory ("user in host in ~/path"), but we moved the
# directory to the front — so the connector would dangle as "...host in on  main".
[username]
format = '· [$user]($style)@'

[hostname]
format = '[$hostname]($style) '   # drop the default ssh_symbol; the "@" already separates

# Minimal profile for the collapsed (transient) prompt — just the character, so it
# keeps Starship's green/red exit-status coloring. Wired up in .zshrc.
[profiles]
transient = '$character'
