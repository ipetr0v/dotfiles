# Starship prompt — https://starship.rs/config/
# Modules use sensible defaults out of the box; tweak below as needed.

# Blank line before each new prompt.
add_newline = true

# Wait up to 1s for slow commands (e.g. git status in huge repos) before skipping.
command_timeout = 1000

# Directory-scan budget per prompt. Default is 30ms; raised because scanning
# Windows-mounted paths (/mnt/c) over WSL's 9p filesystem is slow. The real fix
# is to work in the Linux filesystem (~/) rather than /mnt/c.
scan_timeout = 50

# Hide the Python module. A user-global venv is always active, so VIRTUAL_ENV is
# always set and this module would otherwise render in every directory. Re-enable
# (or drop the always-on venv in favour of pipx) if you want version-in-projects.
[python]
disabled = true
